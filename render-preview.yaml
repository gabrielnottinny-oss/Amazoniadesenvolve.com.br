# Initial validation environment only. Free PostgreSQL expires after 30 days.
databases:
  - name: amazonia-desenvolve-validacao-db
    databaseName: amazonia_desenvolve
    user: amazonia_app
    plan: free
    region: oregon
    ipAllowList: []
services:
  - type: web
    name: amazonia-desenvolve-validacao
    runtime: python
    plan: free
    region: oregon
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py setup_roles && python manage.py bootstrap_admin && exec gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: 'False'
      - key: SECRET_KEY
        generateValue: true
      - key: INITIAL_ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: amazonia-desenvolve-validacao-db
          property: connectionString
